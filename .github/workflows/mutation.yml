name: Mutation Testing (Stryker.NET)

# Run manually or on a schedule (weekly on Sunday night)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'   # 02:00 UTC every Sunday

jobs:
  mutation:
    name: Stryker.NET — Services
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Stryker.NET
        run: dotnet tool install --global dotnet-stryker

      - name: Restore & build
        run: |
          dotnet restore BMS_POS_API.Tests/BMS_POS_API.Tests.csproj
          dotnet build BMS_POS_API.Tests/BMS_POS_API.Tests.csproj --configuration Release

      - name: Run mutation tests
        run: dotnet stryker --config-file stryker-config.json
        working-directory: ${{ github.workspace }}

      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker-report
          path: StrykerOutput/
          retention-days: 30
